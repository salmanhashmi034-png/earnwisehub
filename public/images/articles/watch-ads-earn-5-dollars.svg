<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="adBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="innerConsole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#adBg)"/>

  <!-- Glow effects -->
  <circle cx="220" cy="460" r="260" fill="#f59e0b" opacity="0.08" filter="blur(70px)"/>
  <circle cx="980" cy="180" r="240" fill="#3b82f6" opacity="0.09" filter="blur(65px)"/>

  <!-- Main Card Mockup -->
  <g transform="translate(160, 95)" filter="url(#cardShadow)">
    <rect width="880" height="440" rx="24" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <rect x="20" y="20" width="840" height="320" rx="16" fill="url(#innerConsole)"/>

    <!-- Ad Console Status -->
    <rect x="40" y="40" width="190" height="34" rx="17" fill="#000000" opacity="0.6"/>
    <circle cx="58" cy="57" r="6" fill="#10b981"/>
    <text x="76" y="62" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">SPONSORED CAMPAIGN</text>

    <!-- Star / Cash Icon Visual -->
    <circle cx="440" cy="170" r="50" fill="url(#goldGrad)"/>
    <text x="440" y="186" fill="#18181b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">$</text>

    <text x="440" y="250" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">
      Verified Sponsor Impressions: 5 of 5
    </text>

    <!-- Progress Bar -->
    <rect x="40" y="305" width="800" height="8" rx="4" fill="#27272a"/>
    <rect x="40" y="305" width="800" height="8" rx="4" fill="url(#goldGrad)"/>

    <!-- Bottom Action Details -->
    <g transform="translate(40, 360)">
      <text x="0" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">
        Watch Complete Ads &amp; Earn $5.00 Instant Cash
      </text>
      <text x="0" y="54" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="15">
        Binance Pay (USDT) · PayPal · Payeer · JazzCash / EasyPaisa
      </text>

      <!-- Badge -->
      <g transform="translate(640, 8)">
        <rect width="160" height="42" rx="21" fill="url(#goldGrad)"/>
        <text x="80" y="26" fill="#18181b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">
          $5.00 CASH
        </text>
      </g>
    </g>
  </g>
</svg>
