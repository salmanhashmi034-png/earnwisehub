<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative Glow Grid -->
  <circle cx="200" cy="150" r="220" fill="#06b6d4" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="450" r="260" fill="#10b981" opacity="0.1" filter="blur(70px)"/>

  <!-- Main Card Mockup -->
  <g transform="translate(160, 95)" filter="url(#shadow)">
    <!-- Video Player Frame -->
    <rect width="880" height="440" rx="24" fill="#111827" stroke="#374151" stroke-width="2"/>
    <rect x="20" y="20" width="840" height="320" rx="16" fill="url(#screenGrad)"/>

    <!-- Player Controls Header -->
    <rect x="40" y="40" width="160" height="32" rx="16" fill="#000000" opacity="0.5"/>
    <circle cx="56" cy="56" r="6" fill="#ef4444"/>
    <text x="74" y="61" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">LIVE VIDEO TASK</text>

    <!-- Center Play Button -->
    <circle cx="440" cy="180" r="48" fill="#ef4444"/>
    <polygon points="432,160 460,180 432,200" fill="#ffffff"/>

    <!-- Bottom Progress Bar -->
    <rect x="40" y="305" width="800" height="8" rx="4" fill="#374151"/>
    <rect x="40" y="305" width="800" height="8" rx="4" fill="url(#accent)"/>

    <!-- Lower Information Bar -->
    <g transform="translate(40, 360)">
      <text x="0" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">
        Watch Full Video &amp; Claim Rs. 100 Mobile Load
      </text>
      <text x="0" y="54" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="15">
        Jazz · Zong · Telenor · Ufone Instant Prepaid Recharge
      </text>

      <!-- Badge -->
      <g transform="translate(620, 8)">
        <rect width="180" height="42" rx="21" fill="#10b981"/>
        <text x="90" y="26" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">
          Rs. 100 LOAD
        </text>
      </g>
    </g>
  </g>
</svg>
